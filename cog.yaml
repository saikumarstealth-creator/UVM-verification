build:
  gpu: false
  system_packages:
    - "git"
    - "curl"
    - "build-essential"
  python_version: "3.11"
  python_packages:
    - "pyyaml>=6.0"
    - "jinja2>=3.0"
    - "pydantic>=2.0"
    - "scikit-learn>=1.0.0"
    - "scipy>=1.7.0"
    - "numpy>=1.21.0"
    - "fastapi>=0.115.0"
    - "uvicorn[standard]>=0.34.0"
    - "websockets>=12.0"
    - "python-multipart>=0.0.6"
  run:
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash - && apt-get install -y nodejs && npm install -g npm

predict: "predict.py:Predictor"
