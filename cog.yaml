build:
  gpu: false
  system_packages:
    - "git"
    - "curl"
    - "build-essential"
  python_version: "3.11"
  python_requirements: "backend/requirements.txt"
  run: |
    curl -fsSL https://deb.nodesource.com/setup_20.x | bash - && apt-get install -y nodejs && npm install -g npm

run: "predict.py:Predictor"
