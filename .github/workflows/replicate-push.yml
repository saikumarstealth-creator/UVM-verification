name: Push to Replicate
on:
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Replicate model name (e.g., saikumarstealth-creator/uvmgenerator)'
        required: true
        default: 'saikumarstealth-creator/uvmgenerator'

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cog
        run: |
          sudo curl -o /usr/local/bin/cog -L "https://github.com/replicate/cog/releases/latest/download/cog_$(uname -s)_$(uname -m)"
          sudo chmod +x /usr/local/bin/cog
          cog --version

      - name: Cog login
        run: echo "${{ secrets.REPLICATE_API_TOKEN }}" | cog login --token-stdin

      - name: Push model to Replicate
        id: push
        run: |
          OUTPUT=$(cog push r8.im/${{ inputs.model_name }} 2>&1)
          echo "$OUTPUT"
          VERSION=$(echo "$OUTPUT" | grep -oP 'Pushed image to \S+:(\S+)' | head -1 || echo "")
          if [ -z "$VERSION" ]; then
            VERSION=$(echo "$OUTPUT" | grep -oP 'Pushed \S+:\K(\S+)' | head -1 || echo "latest")
          fi
          if [ -z "$VERSION" ]; then
            VERSION="latest"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create deployment
        run: |
          VERSION="${{ steps.push.outputs.version }}"
          echo "Pushed version: $VERSION"
          curl -s -X POST "https://api.replicate.com/v1/deployments" \
            -H "Authorization: Bearer ${{ secrets.REPLICATE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"uvm-generator\",
              \"model\": \"${{ inputs.model_name }}\",
              \"version\": \"$VERSION\",
              \"hardware\": \"cpu\",
              \"min_instances\": 0,
              \"max_instances\": 1
            }"
