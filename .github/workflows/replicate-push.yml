name: Push to Replicate
on:
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Replicate model name (e.g., saikumarstealth-creator/uvmgenerator)'
        required: true
        default: 'saikumarstealth-creator/uvmgenerator'

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Cog
        run: |
          sudo curl -o /usr/local/bin/cog -L "https://github.com/replicate/cog/releases/latest/download/cog_$(uname -s)_$(uname -m)"
          sudo chmod +x /usr/local/bin/cog
          cog --version

      - name: Cog login
        run: echo "${{ secrets.REPLICATE_API_TOKEN }}" | cog login --token-stdin

      - name: Debug — check Docker
        run: |
          docker version --format '{{.Server.Version}}'
          docker info --format '{{.OSType}}'

      - name: Push model to Replicate
        id: push
        run: |
          OUTPUT=$(cog push r8.im/${{ inputs.model_name }} 2>&1)
          echo "$OUTPUT"
          VERSION=$(echo "$OUTPUT" | grep -oP 'Pushed image to \S+:(\S+)' | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "PUSHED_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Log result
        run: |
          echo "Pushed version: ${{ steps.push.outputs.version }}"
          echo "Model: https://replicate.com/${{ inputs.model_name }}"
